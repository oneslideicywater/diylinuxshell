name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

# 并发控制：同一分支只保留最新的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 全局环境变量
  NODE_VERSION: '20'
  ELECTRON_CACHE_DIR: ~/.cache/electron
  ELECTRON_BUILDER_CACHE_DIR: ~/.cache/electron-builder

jobs:
  # ==================== 测试任务 ====================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: ['20']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # - name: 🔍 Run lint
      #   run: npm run lint

      # - name: 🔍 Run typecheck
      #   run: npm run typecheck

      # - name: 🧪 Run unit tests
      #   run: npm run test:unit

      # - name: 🧪 Run integration tests
      #   run: npm run test:integration

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  # ==================== 构建任务（多平台） ====================
  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于版本号

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # === Windows 特殊配置 ===
      - name: 🪟 Setup MSBuild (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v1.3

      # === macOS 特殊配置 ===
      - name: 🍎 Setup Xcode (macOS)
        if: matrix.os == 'macos-latest'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # === 缓存 Electron 二进制文件 ===
      - name: 💾 Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE_DIR }}
            ${{ env.ELECTRON_BUILDER_CACHE_DIR }}
          key: electron-${{ matrix.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      - name: 🔨 Build application
        run: npm run build

      - name: 📦 Package for Windows
        if: matrix.platform == 'win'
        run: npm run build && npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Package for Linux
        if: matrix.platform == 'linux'
        run: npm run build && npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Package for macOS
        if: matrix.platform == 'mac'
        run: npm run build && npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.dmg
            release/*.zip
            release/latest.yml
            release/latest-mac.yml
            release/builder-effective-config.yaml
          retention-days: 30
          if-no-files-found: error

  # ==================== 发布到 GitHub Release ====================
  release:
    name: 🚀 Create Release
    needs: build
    runs-on: ubuntu-latest
    # 仅在推送 tag 时触发（格式：v*）
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write  # 需要写入权限来创建 Release

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release/

      - name: 📥 Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release/

      - name: 📥 Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release/

      - name: 📋 List release files
        run: ls -lh release/

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false           # 是否为草稿
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          fail_on_unmatched_files: true

      - name: ✅ Release created successfully
        run: echo "🎉 Release ${{ github.ref_name }} has been published!"

  # ==================== E2E 测试（已禁用） ====================
  # e2e-test:
  #   name: E2E Tests (Linux)
  #   needs: build
  #   runs-on: ubuntu-latest
  #   if: false  # 暂时禁用
  #
  #   steps:
  #     - name: 📥 Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: 🔧 Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: 'npm'
  #
  #     - name: 📦 Install dependencies
  #       run: npm ci
  #
  #     - name: 🎭 Install Playwright browsers
  #       run: npx playwright install --with-deps
  #
  #     - name: 🧪 Run E2E tests
  #       run: npm run test:e2e
  #
  #     - name: 📤 Upload Playwright report
  #       uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: playwright-report
  #         path: playwright-report/
  #         retention-days: 7

  # ==================== 清理任务（可选） ====================
  cleanup:
    name: 🧹 Cleanup old artifacts
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    needs: [build]

    steps:
      - name: Delete old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '30 days'  # 删除30天前的制品
          skip-tags: true # 保留 tag 触发的制品
          skip-recent: 5 # 保留最近5个制品
